# Production stack: app (127.0.0.1:3080, behind host Caddy) + PostgreSQL 16.
# Usage and the env list: docs/deploy.md. Secrets live in .env (never committed).
# The app image is never built on the server: APP_IMAGE is the CI-built image pinned by digest,
# e.g. APP_IMAGE=ghcr.io/<owner>/lushu-app@sha256:<digest>. Rollback = set the previous digest + up -d app.
# Two files, two DB roles (docs/deploy.md「数据库角色」):
#   .env      compose-only: APP_IMAGE, POSTGRES_* (owner = migrations only), APP_DB_USER/APP_DB_PASSWORD
#   app.env   app settings; never contains the owner password
# The app connects as APP_DB_USER (no table ownership: cannot TRUNCATE the audit log or disable its
# triggers); `migrate` and `db-roles` connect as the owner via MIGRATION_DATABASE_URL.
name: lushu

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lushu}
      POSTGRES_USER: ${POSTGRES_USER:-lushu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ['postgres', '-c', 'shared_buffers=96MB', '-c', 'max_connections=30', '-c', 'work_mem=4MB']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 384m
    networks: [backend]

  app:
    image: ${APP_IMAGE:?set APP_IMAGE to the CI image pinned by digest (registry/lushu-app@sha256:...)}
    restart: unless-stopped
    env_file: app.env
    environment:
      NODE_ENV: production
      APP_IMAGE_DIGEST: ${APP_IMAGE}
      HOST: 0.0.0.0
      PORT: '3080'
      ROUTEBOOK_DATA_DIR: /data
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgres://${APP_DB_USER:-lushu_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lushu}
      # Requests reach the container from the compose network gateway (docker-proxy for the
      # 127.0.0.1:3080 publish). Trust X-Forwarded-For from that hop only.
      TRUST_PROXY_HEADERS: 'true'
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.31.80.1,127.0.0.1,::1}
    ports:
      - '127.0.0.1:3080:3080'
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    stop_grace_period: 30s
    networks: [backend]

  # One-shot schema migration as the owner, app role grants right after (before backfill/parity), then readiness:
  # `docker compose -f docker-compose.prod.yml run --rm migrate`
  migrate:
    image: ${APP_IMAGE:?set APP_IMAGE to the CI image pinned by digest (registry/lushu-app@sha256:...)}
    profiles: ['tools']
    env_file: app.env
    environment: &owner-env
      NODE_ENV: production
      ROUTEBOOK_DATA_DIR: /data
      MIGRATION_DATABASE_URL: &owner-url postgres://${POSTGRES_USER:-lushu}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lushu}
      # The migration scripts read DATABASE_URL; here it is the owner connection.
      DATABASE_URL: *owner-url
      APP_DB_USER: ${APP_DB_USER:-lushu_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - >-
        node scripts/postgres-migrate.mjs &&
        node scripts/postgres-app-role.mjs &&
        node scripts/postgres-backfill.mjs --data-dir /data --apply &&
        node scripts/postgres-parity.mjs --data-dir /data --mark-ready
    networks: [backend]

  # Create/update only the app role (no migration): needed once before the first image that uses it.
  # `docker compose -f docker-compose.prod.yml run --rm db-roles`
  db-roles:
    image: ${APP_IMAGE:?set APP_IMAGE to the CI image pinned by digest (registry/lushu-app@sha256:...)}
    profiles: ['tools']
    environment: *owner-env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['node', 'scripts/postgres-app-role.mjs']
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.31.80.0/24
          gateway: 172.31.80.1

volumes:
  pgdata:
  appdata:
