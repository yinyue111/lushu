# Optional override: Caddy as a container on lushu_backend with a pinned IP (PROXY_MODE=container).
# Default deployment (Caddy on the host -> 127.0.0.1:3080) does NOT use this file.
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d
# app.env must then trust CADDY_IP (and loopback) only, never the gateway, e.g.
#   TRUSTED_PROXY_CIDRS=172.31.80.10,127.0.0.1,::1
# The app refuses to start otherwise. docs/deploy.md「Caddy 两种部署方式」.
services:
  app:
    environment:
      PROXY_MODE: container
      CADDY_IP: ${CADDY_IP:-172.31.80.10}
    # Only Caddy reaches the app; no host publish (a host hop would arrive from the untrusted gateway).
    ports: !reset []

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    mem_limit: 128m
    networks:
      backend:
        ipv4_address: ${CADDY_IP:-172.31.80.10}

volumes:
  caddy_data:
  caddy_config:
