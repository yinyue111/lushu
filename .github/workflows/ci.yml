name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: routebook_ci
          POSTGRES_PASSWORD: routebook_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routebook_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database credentials for the schema regression.
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: routebook_ci
      PGPASSWORD: routebook_ci
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify (syntax, lint, format, typecheck, build, node:test, regression scripts)
        run: npm run verify
      - name: Ensure PostgreSQL client tools
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: PostgreSQL schema regression
        run: npm run test:postgres-schema
      - name: PostgreSQL storage and concurrent-write regression
        run: npm run test:postgres-storage
      - name: PostgreSQL multi-instance API regression
        run: npm run test:postgres-runtime
      - name: New code still runs on schema v11 (rollback = swap image)
        run: npm run test:postgres-v11
      - name: App DB role is not the owner (existing v12 DB built by the superuser)
        run: npm run test:postgres-app-role
        env:
          ROLE_TEST_OWNER_URL: postgres://routebook_ci:routebook_ci@127.0.0.1:5432/postgres
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
