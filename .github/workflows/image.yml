name: Image

# Builds the production image and tags it by commit, so every release has an immutable image to deploy
# and to roll back to (rollback = deploy the previous commit's image; no SQL needed, see docs/admin.md §6).
# The admin E2E + axe run must pass before the image is built.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: E2E tools (not repo dependencies yet; pinned here)
        run: |
          mkdir -p /tmp/e2e-tools && cd /tmp/e2e-tools
          npm init -y >/dev/null && npm i playwright@1.64.0 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Admin E2E + axe (must be 0 violations)
        env:
          E2E_TOOLS_DIR: /tmp/e2e-tools
        run: npm run test:e2e:admin

  image:
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}/lushu-app
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha7 }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha7 }}
            BUILD_TIME=${{ steps.meta.outputs.built }}
      - name: Image contains the admin build and no source maps
        run: |
          docker pull "$IMAGE:${{ steps.meta.outputs.sha7 }}"
          docker run --rm --entrypoint sh "$IMAGE:${{ steps.meta.outputs.sha7 }}" -c 'test -f /app/dist-admin/index.html && test -f /app/dist/index.html && test ! -e /app/dist-sourcemaps && ! find /app/dist /app/dist-admin -name "*.map" | grep -q .'
      - name: Record digest (deploy by digest)
        run: echo "Deploy with APP_IMAGE=$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
